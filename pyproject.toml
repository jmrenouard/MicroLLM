[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microllm"
version = "0.2.0"
description = "Hybrid System-One Local Decision Engine (JevCompat 32/32 MUST, AnyJev L0 Prefill, StartLux Read-or-Think Cascade, OpenJev-RLCD Trainer)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MicroLLM Contributors" }]
keywords = [
    "llm",
    "routing",
    "cascade",
    "calibration",
    "jevcompat",
    "fastapi",
    "inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.16.0"]
torch = ["torch>=2.0.0", "transformers>=4.40.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/jmrenouard/MicroLLM"
Repository = "https://github.com/jmrenouard/MicroLLM"
Issues = "https://github.com/jmrenouard/MicroLLM/issues"

[project.scripts]
microllm = "microllm.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
microllm = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
