name: Documentation CI

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".vale.ini"
      - ".markdownlint.json"
      - "scripts/mkdocs_hooks.py"
      - "scripts/build_versioned_docs.py"
      - ".github/workflows/docs-ci.yml"
      - "tests/test_diataxis_documentation.py"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".vale.ini"
      - ".markdownlint.json"
      - "scripts/mkdocs_hooks.py"
      - "scripts/build_versioned_docs.py"
      - ".github/workflows/docs-ci.yml"
      - "tests/test_diataxis_documentation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Validate Diataxis, Links, Math, Privacy, and MkDocs Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with dev and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Run Diataxis, math, privacy, governance, and MkDocs test suites
        run: |
          pytest tests/test_diataxis_documentation.py tests/test_docs_math_syntax.py tests/test_repo_privacy_hygiene.py tests/test_project_governance_rules.py tests/test_mkdocs_publishing.py -v

      - name: Build MkDocs site in strict mode
        run: mkdocs build --strict
