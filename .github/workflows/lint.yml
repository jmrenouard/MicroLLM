name: Lint & Type Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff & Flake8 (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff flake8

      - name: Run Ruff linter
        run: |
          ruff check src tests --select=E9,F63,F7,F82
          ruff check src tests --exit-zero

      - name: Run Flake8 syntax and complexity checks
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src tests --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

  typecheck:
    name: Mypy Type Check (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" mypy

      - name: Run mypy static type analysis
        run: |
          mypy src/microllm --ignore-missing-imports --check-untyped-defs
