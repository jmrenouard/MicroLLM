name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        if [ -n "$CONDA" ] && [ -x "$CONDA/bin/conda" ]; then
          echo "$CONDA/bin" >> $GITHUB_PATH
        elif [ -x "/usr/share/miniconda/bin/conda" ]; then
          echo "/usr/share/miniconda/bin" >> $GITHUB_PATH
        elif [ -x "$HOME/miniconda/bin/conda" ]; then
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH
        else
          echo "Miniconda not pre-installed; installing Miniconda..."
          curl -fsSL https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -o /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -p "$HOME/miniconda"
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH
        fi
    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
