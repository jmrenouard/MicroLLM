name: Jekyll site CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: jekyll-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Jekyll Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build site with Jekyll Docker
        run: |
          mkdir -p ${{ github.workspace }}/_site
          mkdir -p ${{ github.workspace }}/.jekyll-cache
          docker run --rm \
            -v ${{ github.workspace }}:/srv/jekyll:ro \
            -v ${{ github.workspace }}/_site:/srv/jekyll/_site:rw \
            -v ${{ github.workspace }}/.jekyll-cache:/srv/jekyll/.jekyll-cache:rw \
            jekyll/builder:4.2.2 \
            jekyll build --future --destination /srv/jekyll/_site
